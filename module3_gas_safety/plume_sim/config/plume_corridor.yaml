# 복도 45 × 3.5 m: 남쪽 벽 배관 (15, -1.6)에서 누출, 복도 환기류가 홈(-20, 0) 쪽(-x)으로 분다.
plume_sim:
  ros__parameters:
    source_x: 15.0
    source_y: -1.6
    release_rate: 150.0
    wind_direction: 3.1416
